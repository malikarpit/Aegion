name: Extension CI

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./aegion-vscode

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: aegion-vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run Tests
        # headless browser tests
        run: xvfb-run -a npm test

      - name: Package
        run: npx vsce package --no-dependencies

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegion-vscode-vsix
          path: aegion-vscode/*.vsix
          if-no-files-found: warn
