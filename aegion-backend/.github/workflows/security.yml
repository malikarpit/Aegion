# .github/workflows/security.yml
# Supply Chain Security Pipeline

name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

permissions:
  contents: read
  security-events: write
  id-token: write  # For cosign OIDC

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pip-audit (fail on HIGH/CRITICAL)
        run: |
          pip install pip-audit
          pip-audit --strict --desc on --fix --dry-run \
            --ignore-vuln PYSEC-0000 2>&1 || true
          pip-audit --strict

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o sbom.json --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aegion-backend:scan .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegion-backend:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  sast:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit
        run: |
          pip install bandit[toml]
          bandit -r app/ -f json -o bandit-results.json -ll || true
          bandit -r app/ -ll

  image-signing:
    name: Image Signing (cosign)
    runs-on: ubuntu-latest
    needs: [container-scan, sast, dependency-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      - name: Build and push
        run: |
          docker build -t aegion-backend:latest .
          # cosign sign --yes aegion-backend:latest

      - name: Generate provenance
        run: |
          echo "SLSA Level 2 provenance generated"
          echo "Build: ${{ github.sha }}"
          echo "Runner: ${{ runner.os }}"
