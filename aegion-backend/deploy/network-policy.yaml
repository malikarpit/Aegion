# Aegion Network Policy — Kubernetes
# Zero-Trust Network Model
# Only explicitly allowed connections are permitted.
# No lateral movement between services.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegion-backend-policy
  namespace: aegion
spec:
  podSelector:
    matchLabels:
      app: aegion-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only NGINX can reach the backend
    - from:
        - podSelector:
            matchLabels:
              app: aegion-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Backend → Redis (TLS)
    - to:
        - podSelector:
            matchLabels:
              app: aegion-redis
      ports:
        - protocol: TCP
          port: 6380
    # Backend → Neo4j (Bolt+TLS)
    - to:
        - podSelector:
            matchLabels:
              app: aegion-neo4j
      ports:
        - protocol: TCP
          port: 7687
    # Backend → Sandbox Agent (gRPC mTLS)
    - to:
        - podSelector:
            matchLabels:
              app: aegion-sandbox-agent
      ports:
        - protocol: TCP
          port: 50051
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # AI model APIs (external)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegion-sandbox-isolation
  namespace: aegion
spec:
  podSelector:
    matchLabels:
      app: aegion-sandbox-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only backend can reach sandbox agent
    - from:
        - podSelector:
            matchLabels:
              app: aegion-backend
      ports:
        - protocol: TCP
          port: 50051
  egress:
    # Sandbox has NO egress (network=none for containers)
    # DNS only for container image pull
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
