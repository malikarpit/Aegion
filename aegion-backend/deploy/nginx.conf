# Aegion NGINX Reverse Proxy Configuration
# Deployment Architecture

# Security headers are set in app/middleware/security_headers.py
# This config focuses on TLS, proxying, and rate limiting at edge

upstream aegion_backend {
    server backend:8000;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Request limits
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Hide server version
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://aegion_backend;
        proxy_read_timeout 30s;
    }

    # Auth endpoints (stricter rate limit)
    location /api/v1/auth/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://aegion_backend;
        proxy_read_timeout 10s;
    }

    # WebSocket upgrade
    location /ws/ {
        proxy_pass http://aegion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://aegion_backend;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # File upload endpoint (larger body)
    location /api/v1/upload {
        limit_req zone=general burst=5 nodelay;
        client_max_body_size 10m;
        proxy_pass http://aegion_backend;
        proxy_read_timeout 60s;
    }
}
