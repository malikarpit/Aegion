version: "3.9"

services:
  # ────────────────────────────────────────────────
  # Jaeger (Distributed Tracing)
  # ────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.50
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Web UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    restart: unless-stopped
    networks:
      - default
