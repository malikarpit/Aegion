version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegion/backend:latest
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AEGION_AUTH_ADAPTER=firebase
      - AEGION_STORE_BACKEND=file
      - AEGION_EVENT_ADAPTER=inprocess
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-production_password_change_me}
      - RATE_LIMIT_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    volumes:
      - aegion_data:/app/.aegion_data
      - aegion_sessions:/app/.aegion/council_sessions

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: always

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-production_password_change_me}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    healthcheck:
      test: [ "CMD-SHELL", "neo4j status || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - neo4j_data:/data
    restart: always

volumes:
  aegion_data:
  aegion_sessions:
  redis_data:
  neo4j_data:
