# Aegion — Docker Compose (Development & Testing)
#
# Full stack: Backend, Redis, Neo4j, Prometheus, Grafana
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up backend     # Start backend only
#   docker-compose down -v        # Stop and remove volumes

version: "3.9"

services:
  # ────────────────────────────────────────────────
  # Aegion Backend
  # ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - AEGION_AUTH_ADAPTER=firebase
      - AEGION_STORE_BACKEND=file
      - AEGION_EVENT_ADAPTER=inprocess
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aegion-dev-password
      - AUDIT_SIGNING_KEY=${AUDIT_SIGNING_KEY:-aegion-dev-signing-key}
      - RATE_LIMIT_ENABLED=true
      - SUPABASE_URL=postgresql://aegion:aegion-dev-password@postgres:5432/aegion
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 256m

  # ────────────────────────────────────────────────
  # Redis (Rate Limiting, Caching)
  # ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Neo4j (Knowledge Graph)
  # ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/aegion-dev-password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    healthcheck:
      test: ["CMD-SHELL", "neo4j status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Prometheus (Metrics)
  # ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Grafana (Dashboards)
  # ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aegion-dev
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # PostgreSQL + pgvector (W8.1)
  # ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aegion
      - POSTGRES_PASSWORD=aegion-dev-password
      - POSTGRES_DB=aegion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegion"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Frontend (W8.2 — uncomment when aegion-frontend is ready)
  # ────────────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ../aegion-frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://backend:8000
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
  prometheus_data:
  grafana_data:
  postgres_data:
