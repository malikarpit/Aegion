[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers -m "not slow"
testpaths =
    tests
markers =
    unit: Fast unit tests (mocked dependencies)
    integration: Tests requiring external services (DB, Docker)
    e2e: End-to-end tests covering full flows
    contract: API contract tests
    slow: Slow running tests (>1s)

asyncio_mode = auto
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
