# ============================================================
# Aegion — Google Cloud Build CI/CD Pipeline
# ============================================================
# Triggers:
#   - Push to main branch (via Cloud Build trigger in GCP console)
#
# Prerequisites (one-time GCP setup):
#   gcloud projects create aegion-prod --name="Aegion Production"
#   gcloud config set project aegion-prod
#   gcloud services enable \
#     run.googleapis.com cloudbuild.googleapis.com \
#     artifactregistry.googleapis.com secretmanager.googleapis.com \
#     firebase.googleapis.com
#   gcloud artifacts repositories create aegion \
#     --repository-format=docker --location=us-central1
# ============================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: aegion-backend
  _REGISTRY: us-central1-docker.pkg.dev/$PROJECT_ID/aegion
  _IMAGE: $_REGISTRY/backend
  _CLOUD_RUN_SA: aegion-cloudrun@$PROJECT_ID.iam.gserviceaccount.com
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "5"
  _MEMORY: "512Mi"
  _CPU: "1"
  # Backend URL passed as substitution so frontend-build doesn't need gcloud SDK
  _BACKEND_URL: "https://aegion-backend-placeholder.run.app"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

steps:
  # ─── Step 1: Run backend unit tests before building ─────────────────────
  - id: backend-test
    name: python:3.12-slim
    dir: aegion-backend
    entrypoint: bash
    args:
      - -c
      - |
        pip install poetry --quiet
        poetry config virtualenvs.create false
        poetry install --no-interaction --no-ansi --only main,dev --no-root
        python -m pytest tests/

  # ─── Step 2: Build backend Docker image ─────────────────────────────────
  - id: backend-build
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-test]
    args:
      - build
      - --tag=$_IMAGE:$COMMIT_SHA
      - --tag=$_IMAGE:latest
      - --cache-from=$_IMAGE:latest
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - ./aegion-backend

  # ─── Step 3: Push image to Artifact Registry ────────────────────────────
  - id: backend-push
    name: gcr.io/cloud-builders/docker
    waitFor: [backend-build]
    args:
      - push
      - --all-tags
      - $_IMAGE

  # ─── Step 4: Deploy backend to Cloud Run ────────────────────────────────
  - id: backend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [backend-push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_IMAGE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --service-account=$_CLOUD_RUN_SA
      - --memory=$_MEMORY
      - --cpu=$_CPU
      - --min-instances=$_MIN_INSTANCES
      - --max-instances=$_MAX_INSTANCES
      - --allow-unauthenticated
      - --set-env-vars=ENVIRONMENT=production
      # Secrets are injected via Secret Manager — add/adjust as needed:
      # - --set-secrets=SUPABASE_URL=supabase-url:latest
      # - --set-secrets=SUPABASE_SERVICE_KEY=supabase-service-key:latest
      # - --set-secrets=AUDIT_SIGNING_KEY=audit-signing-key:latest
      - --port=8080

  # ─── Step 5: Build frontend ──────────────────────────────────────────────
  # NOTE: Uses _BACKEND_URL substitution — no gcloud SDK needed in node image.
  # To point to the live backend URL, update _BACKEND_URL in the Cloud Build
  # trigger substitutions in the GCP console after first backend deploy.
  - id: frontend-build
    name: node:20-slim
    dir: aegion-frontend
    waitFor: ['-']   # Run in parallel with backend steps
    entrypoint: bash
    args:
      - -c
      - |
        npm ci --prefer-offline
        NEXT_PUBLIC_API_URL=$_BACKEND_URL npm run build

  # ─── Step 6: Deploy frontend to Firebase Hosting ────────────────────────
  - id: frontend-deploy
    name: node:20-slim
    waitFor: [frontend-build, backend-deploy]
    dir: aegion-frontend
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project=$PROJECT_ID --non-interactive
    env:
      - 'FIREBASE_TOKEN=$$FIREBASE_TOKEN'
    secretEnv: ['FIREBASE_TOKEN']

# Push final image tags
images:
  - $_IMAGE:$COMMIT_SHA
  - $_IMAGE:latest

timeout: 1800s  # 30 minutes max

# ─── Secret Manager bindings ─────────────────────────────────────────────────
# Declares secrets that steps can consume via secretEnv.
# Prerequisites (one-time):
#   gcloud secrets create firebase-token --data-file=-  <<< "<your-firebase-ci-token>"
#   gcloud secrets add-iam-policy-binding firebase-token \
#     --member=serviceAccount:$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')@cloudbuild.gserviceaccount.com \
#     --role=roles/secretmanager.secretAccessor
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-token/versions/latest
      env: FIREBASE_TOKEN

# ─── Notes ───────────────────────────────────────────────────────────────────
# Firebase builder (step 6) requires a custom Docker image. Create it once:
#
#   git clone https://github.com/GoogleCloudPlatform/cloud-builders-community
#   cd cloud-builders-community/firebase
#   gcloud builds submit --config cloudbuild.yaml .
#
# Alternatively, use the firebase-tools npm package inline:
#   name: node:20
#   entrypoint: bash
#   args: ['-c', 'npm install -g firebase-tools && firebase deploy --only hosting']
#   env: ['FIREBASE_TOKEN=$$FIREBASE_TOKEN']
#   secretEnv: ['FIREBASE_TOKEN']
